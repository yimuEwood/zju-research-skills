name: offline capability checks

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-runtime.txt
      - name: Install deterministic test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Run unit and executable-artifact tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run static script scan
        run: python tests/security_scan.py
      - name: Run portfolio structure audit
        run: python evals/audit_skill_portfolio.py --minimum 80
      - name: Qualify the stable distribution
        run: python evals/check_distribution_release.py
      - name: Validate evaluation suites
        run: python evals/validate_suite.py
      - name: Rebuild the twenty-skill L1 census
        run: |
          python evals/generate_l1_census_v3.py --output evals/l1-contract-census-v3.json
          git diff --exit-code -- evals/l1-contract-census-v3.json
      - name: Confirm capability evidence remains fail-closed
        shell: bash
        run: |
          set +e
          python evals/score_portfolio_v3.py --results evals/current-portfolio-evidence-v3.json --output portfolio-v3-current-score.json
          status=$?
          set -e
          test "$status" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("portfolio-v3-current-score.json").read_text(encoding="utf-8"))
          assert report["valid_input"] is True
          assert report["portfolio_status"] == "beta"
          assert report["official_portfolio_score"] is None
          assert report["release_gate_passed"] is False
          assert report["evidence_coverage"]["L1_contract_conformance"]["complete_skills"] == 20
          assert report["evidence_coverage"]["L2_deterministic_function"]["complete_skills"] == 20
          assert report["evidence_coverage"]["L3_controlled_task_capability"]["complete_skills"] == 0
          assert report["evidence_coverage"]["L4_frozen_holdout_generalization"]["complete_skills"] == 0
          PY
