name: offline capability checks

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install deterministic test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Run unit and executable-artifact tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run static script scan
        run: python tests/security_scan.py
      - name: Run portfolio structure audit
        run: python evals/audit_skill_portfolio.py --minimum 80
      - name: Validate evaluation suites
        run: python evals/validate_suite.py
