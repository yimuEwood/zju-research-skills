name: publish stable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Match the annotated tag to the package version
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open(".codex-plugin/plugin.json", encoding="utf-8"))["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
          git cat-file -t "$GITHUB_REF_NAME" | grep -qx tag
      - name: Install deterministic test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Run complete offline test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run static script scan
        run: python tests/security_scan.py
      - name: Qualify the stable distribution
        run: python evals/check_distribution_release.py
      - name: Confirm capability evidence remains fail-closed
        shell: bash
        run: |
          set +e
          python evals/score_portfolio_v3.py --results evals/current-portfolio-evidence-v3.json --output portfolio-v3-current-score.json
          status=$?
          set -e
          test "$status" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("portfolio-v3-current-score.json").read_text(encoding="utf-8"))
          assert report["valid_input"] is True
          assert report["portfolio_status"] == "beta"
          assert report["official_portfolio_score"] is None
          assert report["release_gate_passed"] is False
          assert report["evidence_coverage"]["L1_contract_conformance"]["complete_skills"] == 20
          assert report["evidence_coverage"]["L2_deterministic_function"]["complete_skills"] == 0
          assert report["evidence_coverage"]["L3_controlled_task_capability"]["complete_skills"] == 0
          assert report["evidence_coverage"]["L4_frozen_holdout_generalization"]["complete_skills"] == 0
          PY
      - name: Create GitHub Release
        shell: bash
        run: |
          notes="docs/release-notes-${GITHUB_REF_NAME}.md"
          test -f "$notes"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "ZJU Research OS $GITHUB_REF_NAME" --notes-file "$notes"
