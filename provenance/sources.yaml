distillation_policy:
  - "Write original concise workflows; do not vendor complete upstream skills."
  - "Preserve attribution, pinned commits, and license boundaries."
  - "Treat repository popularity as discovery evidence, not correctness evidence."
  - "Require local tests and task evals before marking a skill stable."
  - "Do not adapt noncommercial or share-alike material into the Apache-2.0 bundle; record it as inspected-only."

