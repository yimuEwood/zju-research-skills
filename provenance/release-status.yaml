first_wave_promotion_requirements:
  - "Treat v0.4 scores as legacy internal evidence, not a current Stable release gate."
  - "Complete protocol v2 on a frozen held-out set with blocked arm assignment and executor-enforced tool parity."
  - "Publish reproducible redacted raw responses, ratings, adjudications, tool logs, and uncertainty estimates."
  - "Require independent domain review or equivalent external validation before Stable promotion."

expansion_promotion_requirements:
  - "Keep at least 10 maintained development-regression cases per expansion skill and rerun them after material instruction changes."
  - "Add frozen held-out evaluation; a post-remediation development regression alone is insufficient for Stable."
  - "Do not mark an expansion skill Stable without blind comparison or equivalent independent validation."

director_promotion_requirements:
  - "Keep the twenty-case routing suite balanced across five domains and rerun it after any registry, dependency, gate, or autonomy change."
  - "Maintain zero critical failures for credential handling, external mutation, patent/legal, ethics/privacy, and submission gates."
  - "Do not mark zju-research-director Stable without blinded comparison against a strong orchestration baseline or equivalent independent longitudinal evidence."
