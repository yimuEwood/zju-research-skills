v07_capability_upgrade:
  evidence_synthesis: "Explicit REML or DerSimonian-Laird tau-squared selection, normal or Hartung-Knapp inference, prediction intervals, and small-k/heterogeneity warnings."
  data_availability: "Separates local_package_ready from publication_release_ready and records identifier/license verification state."
  hypothesis_design: "Constrained experiment portfolio selection with common cost units, dependencies, exclusions, required experiments, feasibility, and ethics eligibility."
  deterministic_tests_passed: 186
  skill_scripts_scanned: 46
  static_findings: 0

v06_capability_upgrade:
  release: "0.6.0-beta.1"
  scope:
    - "JSON/JSONL, CSV/TSV, RIS, BibTeX, and NBIB literature import into the existing stable-ID deduplication pipeline"
    - "Offline PDF and UTF-8 text extraction into page-anchored reader source bundles with hashes, coverage, and navigation inventories"
    - "Bounded Welch and paired t tests, Pearson correlation, and simple OLS execution into the canonical result registry"
    - "Real PNG, SVG, and PDF export for supported group, paired, and scatter/OLS panels"
    - "Platform-neutral execution-provider registry and deterministic host-inventory resolver"
  evidence_boundary: "These are deterministic execution and artifact tests, not a new scientific-answer quality score or external benchmark."
  executable_artifact_tests:
    tests: 13
    scope: "Four PDF/text source-preparation tests plus nine CSV-to-analysis/result/figure-chain tests, including real group/paired/OLS exports and partial-family, wrong-data, and wrong-column rejection."
  capability_and_contract_tests:
    total_unit_tests_passed: 131
    shipped_scripts_scanned: 43
    real_export_formats_checked: [pdf_source, png, svg, pdf_figure]
  ci: "Windows and Ubuntu matrix for Python 3.11 and 3.13 is defined in .github/workflows/ci.yml; remote run status is not claimed until GitHub executes it."

evidence_policy:
  public_claim_level: "internal directional evidence"
  stable_promotion_suspended: true
  direct_comparison_scope: "Only the first seven skills were directly compared with pinned Nature Skills and no-skill arms."
  raw_records_public: false
  public_artifacts: "Cases, evaluation code, and aggregate results are public; complete responses, events, and per-record ratings are not yet published."
  protocol_v2:
    target_release: "v0.5.0-beta.1"
    status: "protocol_ready_no_frozen_holdout"
    rerun_completed: false
    promotion_decision_available: false
    implemented_controls:
      - "Content-fingerprint exclusion of known cases and immutable holdout lock"
      - "Private committed A/B/C assignment with per-skill blocked Latin balance"
      - "First-attempt registry and hash inventory for response, event, execution, rating, rubric, schema, and Skill commit"
      - "Strict event termination/tool audit and rater identity/schema checks"
      - "Paired uncertainty, agreement, gold-check, critical-failure, and deviation gates"
    pending_evidence:
      - "Independently authored frozen held-out cases"
      - "Executor-enforced identical tool policy during a real three-arm run"
      - "Cross-model and independent human review"
      - "Public reproducible redacted run bundle"

v05_engineering_upgrade:
  release: "0.5.0-beta.1"
  director_contract:
    mission_schema: "1.1"
    legacy_migration: "1.0 artifacts are trust-reducing migrated; prior validated labels become inert audit history."
    artifact_checks:
      - "producer and producer-step output contract"
      - "base-directory containment after path resolution"
      - "actual local content SHA-256 and supported format signature"
      - "artifact-specific validator receipt and canonical command binding"
    release_checks:
      - "release artifact IDs cover machine-derived requested-deliverable output groups"
      - "all applicable upstream gates are recomputed"
      - "human decision references a separately supplied trusted-channel receipt"
    semantic_boundary: "Engineering validation does not certify scientific, visual, legal, ethical, or institutional correctness."
  specialist_fixes:
    - "Preserve identity-free literature records rather than false-merging them."
    - "Distinguish new, updated, and duplicate monitored works with version history."
    - "Require declared sources, exact anchors, and numeric invariants for formal patent claims."
    - "Recompute real local file hashes for figure and provenance manifests."

