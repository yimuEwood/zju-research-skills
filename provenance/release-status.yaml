  release_notes: "docs/release-notes-v1.1.0.md"
  distribution_status: stable
  capability_evaluation_status: beta
  official_portfolio_score: null
  release_gate: "20 core Skills; L1 120/120; L2 400/400; 296 tests discovered and passed locally with the optional upstream cache; clean checkout requires 295 passes and transparently skips one optional cache check; 68 core-plus-pack scripts with zero static findings; Ubuntu/Windows and Python 3.11/3.13 CI; Codex/Claude Code/OpenCode manifests."
